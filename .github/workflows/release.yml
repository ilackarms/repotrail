name: Release

# Releases the version in package.json when a push to main changes it:
# publishes the `repotrail` npm package and the extension on the VS Code
# Marketplace, and creates a GitHub release with the .vsix. Other pushes stop
# after the first step.
#
# Each job checks every target first and skips one that already has the
# version, so "Re-run failed jobs" finishes a release from the same commit
# without publishing anything twice.
#
# Only the publish job can mint the OIDC token that npm and the Marketplace
# trust, and it runs no install scripts. Both registries trust this workflow
# by its file name, with no stored token, so don't rename this file.
# Setup and recovery: docs/releasing.md.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ilackarms/repotrail'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.status.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check whether this push changes the version
        id: bump
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! git fetch --quiet --no-tags --depth=1 origin "$BEFORE"; then
            echo "::warning::Couldn't fetch the previous commit ($BEFORE), so this run can't tell whether the version changed. Not releasing."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous=$(git show "$BEFORE:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          echo "Version: $previous -> $version"
          if [ "$previous" = "$version" ]; then echo "changed=false"; else echo "changed=true"; fi >> "$GITHUB_OUTPUT"

      - name: Check what's released
        id: status
        if: steps.bump.outputs.changed == 'true'
        run: node scripts/release-status.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.status.outputs.pending == 'true'
        with:
          version: 11.5.2

      - name: Build and test
        if: steps.status.outputs.pending == 'true'
        env:
          VERSION: ${{ steps.status.outputs.version }}
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm package
          node scripts/pack-npm.mjs
          mkdir release
          mv "repotrail-$VERSION.vsix" release/
          mv dist/npm release/npm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.status.outputs.pending == 'true'
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # trusted publishing to npm and the Marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1 or later; vsce 4 needs Node 22.
          node-version: 24

      # Checked again, not taken from the build job: on a re-run, an earlier
      # attempt may already have published to one of the registries.
      - name: Check what's released
        id: status
        run: node scripts/release-status.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download
        with:
          name: release
          path: release

      - name: Publish to npm
        if: steps.status.outputs.npm == 'missing'
        run: npm publish ./release/npm # without ./, npm reads the path as a GitHub repo

      # The Marketplace still gets its try when npm fails, and the other way round.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: ${{ !cancelled() && steps.download.outcome == 'success' && steps.status.outputs.marketplace == 'missing' }}
        with:
          version: 11.5.2

      - name: Install vsce from the lockfile, without install scripts
        id: vsce
        if: ${{ !cancelled() && steps.download.outcome == 'success' && steps.status.outputs.marketplace == 'missing' }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Publish to the VS Code Marketplace
        if: ${{ !cancelled() && steps.vsce.outcome == 'success' }}
        run: pnpm exec vsce publish --oidc --packagePath "release/repotrail-$VERSION.vsix"
        env:
          VERSION: ${{ steps.status.outputs.version }}

  github-release:
    needs: build
    if: needs.build.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check what's released
        id: status
        run: node scripts/release-status.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.status.outputs.github == 'missing'
        with:
          name: release
          path: release

      - name: Create the GitHub release
        if: steps.status.outputs.github == 'missing'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.status.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          awk -v heading="## $VERSION" '$0 == heading || index($0, heading " ") == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > "$notes"
          grep -q '[^[:space:]]' "$notes" || echo "See CHANGELOG.md." > "$notes"
          gh release create "v$VERSION" "release/repotrail-$VERSION.vsix" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "RepoTrail $VERSION" --notes-file "$notes"
